[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-webgpu"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "vllm>=0.29.0,<0.30",  # v1 internal paths verified against 0.29.0; update with care
    # !=0.32.0 is the whole of it: that release builds its
    # on_submitted_work_done callback with a 3-argument signature while its own
    # bundled header declares 4 (a WGPUStringView was added), so every queue
    # flush raises TypeError from inside wgpu/backends/wgpu_native/_api.py.
    # Fix is pygfx/wgpu-py#824, open since 2026-07-24 and not yet released.
    # Nothing else about 0.32 is a problem: the full suite passes against it
    # with that one line patched, so drop this marker once #824 ships.
    "wgpu>=0.20,!=0.32.0",
    "numpy>=1.24",
    "safetensors>=0.4",
    "compressed-tensors>=0.9",  # directly imported in quant/weight_loader.py
]

[project.entry-points."vllm.platform_plugins"]
webgpu = "vllm_webgpu:register"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["vllm_webgpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
filterwarnings = [
    # torch.jit.script_method is deprecated upstream; not vllm-webgpu code.
    "ignore:`torch.jit.script_method` is deprecated:DeprecationWarning",
    # SWIG internal type registration noise from the wgpu C extension.
    "ignore:builtin type SwigPy:DeprecationWarning",
]
