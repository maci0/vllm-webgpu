[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-webgpu"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "vllm>=0.25.1,<0.26",  # v1 internal paths verified against 0.25.1; update with care
    "wgpu>=0.20",
    "numpy>=1.24",
    "safetensors>=0.4",
    "compressed-tensors>=0.9",  # directly imported in quant/weight_loader.py; vllm 0.25.1 pins ==0.17.0
]

[project.entry-points."vllm.platform_plugins"]
webgpu = "vllm_webgpu:register"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["vllm_webgpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
filterwarnings = [
    # torch.jit.script_method is deprecated upstream; not vllm-webgpu code.
    "ignore:`torch.jit.script_method` is deprecated:DeprecationWarning",
    # SWIG internal type registration noise from the wgpu C extension.
    "ignore:builtin type SwigPy:DeprecationWarning",
]
